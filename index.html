const TYPE={alternator:'alternator',starter:'starter',radiator:'radiator',condenser:'radiator','rad-fan':'fan',battery:'battery','strut-fl':'strut','strut-fr':'strut','shock-r':'shock','rotor-f':'rotor','drum-r':'drum','caliper-f':'caliper','cv-axle-l':'cvaxle','cv-axle-r':'cvaxle',muffler:'muffler','flex-pipe':'pipe','mid-pipe':'pipe','oil-filter':'filterCan','fuel-filter':'filterCan','water-pump':'pump','ps-pump':'pump','ac-comp':'compressor','fuel-tank':'tank',airbox:'airbox','intake-mani':'manifold','exh-mani':'exhmani','spark-plugs':'coilpack'};
function primitive(p){
  const type=TYPE[p.id]; let m;
  if(type&&LIB[type]){ m=LIB[type](p); m.position.set(...p.pos); if(p.rot) m.rotation.set(...p.rot); }
  else { const geo=p.shape==='cyl'?new THREE.CylinderGeometry(p.size[0],p.size[0],p.size[1],28):new THREE.BoxGeometry(...p.size);
    m=mesh(geo,M.plain(p.color)); if(p.rot) m.rotation.set(...p.rot); m.position.set(...p.pos);
    m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x000000,transparent:true,opacity:0.3}))); }
  /* seat engine-bay parts under the traced hood line (generic rule; keeps any car's bay inside its skin) */
  if(['Engine','Cooling','Fuel & Air','Ignition & Electrical','HVAC','Steering'].includes(p.sys)&&p.pos[0]>COWL[0]-0.5){
    m.updateMatrixWorld(true); const bb=new THREE.Box3().setFromObject(m); const lim=topAt(bb.max.x)-0.12; if(bb.max.y>lim){ m.position.y-=(bb.max.y-lim); } }
  return m;
}
function buildPart(p){
  const custom=overlay.parts[p.id]&&overlay.parts[p.id].pos; const b=BUILDERS[p.id];
  let root=(b&&!p.custom)?b(p):null; if(!root) root=primitive(p);
  else if(custom) root.position.set(...p.pos);
  if(b&&p.color!==undefined&&overlay.parts[p.id]&&overlay.parts[p.id].color!==undefined) setPaint(root,p.color);
  root.traverse(o=>{if(o.material){o.userData.baseOpacity=o.material.opacity;}});
  root.userData={p,rest:root.position.clone(),ex:new THREE.Vector3(...p.ex),built:!!b}; return root;
}
function rebuild(){
  const selId=selected?selected.userData.p.id:null;
  for(const m of meshes){group.remove(m); m.traverse(o=>{if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose();});}
  meshes=[]; byId={};
  for(const p of allParts()){const m=buildPart(p); group.add(m); meshes.push(m); byId[p.id]=m;}
  setPaint(shell,paintColor());
  selected=selId?byId[selId]||null:null; if(selected) setEmissive(selected,0x8a4a10);
  applyFilter();
}

canvas.addEventListener('pointerup',e=>{ if(!down)return; const mv=Math.hypot(e.clientX-down[0],e.clientY-down[1]); down=null; if(mv>6)return;
  ptr.x=(e.clientX/innerWidth)*2-1; ptr.y=-(e.clientY/innerHeight)*2+1; ray.setFromCamera(ptr,camera);
  const hits=ray.intersectObjects(meshes.filter(m=>m.visible),true); let o=hits.length?hits[0].object:null; while(o&&!(o.userData&&o.userData.p)) o=o.parent; select(o||null); });

function readForm(f,withGeo){

  if(withGeo){ const n=k=>parseFloat(g(k))||0; o.shape=g('shape'); o.pos=[n('px'),n('py'),n('pz')]; o.size=o.shape==='cyl'?[n('sa')||0.3,n('sb')||1]:[n('sa')||1,n('sb')||1,n('sc')||1]; o.ex=[n('ex'),n('ey'),n('ez')]; o.color=parseInt(g('color').slice(1),16); o.body=!!f.elements.body.checked; }

/* ===== SYSTEMS (what each system does, its parts, how systems interact) ===== */
function partsOf(s){return allParts().filter(p=>p.sys===s);}
function linkNames(text,parts){ let out=esc(text); for(const p of parts.slice().sort((a,b)=>b.name.length-a.name.length)){const short=esc(p.name.replace(/\s*\(.*?\)/g,'').replace(/\s*\+.*$/,'').trim()); if(short.length<4) continue; const re=new RegExp('(^|[^\\w-])('+short.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')(?=[^\\w-]|$)','i'); out=out.replace(re,(m,a,b)=>`${a}<span class="chip" data-part="${p.id}" style="padding:1px 7px">${b}</span>`);} return out; }
function showSystems(name){ open('sys'); const b=document.getElementById('sbody');
  if(!name){ b.innerHTML=`<h2>Systems</h2><div class="sys">the car in ${SYSTEMS.length} pieces · tap one</div><div class="refresh"><b>Refresher</b>A car is a few systems bolted together: the engine makes power, cooling keeps it alive, fuel & air feed it, ignition & electrical light it and run everything else, the transaxle sends power to the wheels, and suspension/steering/brakes control where it goes. Everything else is comfort and skin.</div>`+
      SYSTEMS.map(s=>{const i=SYSTEM_INFO[s]||{}; const n=partsOf(s).length; return `<button class="card" data-sys="${esc(s)}"><b>${esc(s)}</b> <span class="badge cL">${n} part${n===1?'':'s'}</span><small>${esc(i.does||'')}</small></button>`;}).join('');
    b.querySelectorAll('[data-sys]').forEach(el=>el.addEventListener('click',()=>showSystems(el.dataset.sys))); return; }
  const i=SYSTEM_INFO[name]||{}; const parts=partsOf(name);
  let h=`<button class="back" id="bSysBack">‹ All systems</button><h2>${esc(name)}</h2><div class="sys">${parts.length} parts on this car</div>`;
  h+=`<div class="what">${esc(i.does||'')}</div>`;
  if(i.refresher) h+=`<div class="refresh"><b>Refresher</b>${esc(i.refresher)}</div>`;
  if(i.how) h+=`<h3>How it works on this car</h3><div style="font-size:13.5px;line-height:1.5">${linkNames(i.how,parts)}</div>`;
  if(i.watch) h+=`<h3>What usually goes wrong</h3><div class="fails">${esc(i.watch)}</div>`;
  if(i.interacts&&i.interacts.length) h+=`<h3>Works together with</h3>`+i.interacts.map(x=>`<button class="card" data-sys="${esc(x.with)}"><b>${esc(x.with)}</b><small>${esc(x.how)}</small></button>`).join('');
  h+=`<h3>Parts in this system</h3><div class="row" style="margin-bottom:6px"><button class="pri" id="bSysShow">Show only these on the car</button></div>`+parts.map(p=>{const c=isCorrected(p.id)?'C':(p.conf||'L'); const n=PART_NOTES[p.id]; return `<div class="item" data-part="${p.id}">${esc(p.name)} <span class="badge c${c}">${CONF[c].split(' ')[0]}</span><small>${n?esc(n.does):esc(p.sys)}</small></div>`;}).join('');
  b.innerHTML=h;
  b.querySelectorAll('[data-sys]').forEach(el=>el.addEventListener('click',()=>showSystems(el.dataset.sys)));
  b.querySelectorAll('[data-part]').forEach(el=>el.addEventListener('click',e=>{e.stopPropagation(); const m=byId[el.dataset.part]; if(m) select(m);}));
  document.getElementById('bSysBack').onclick=()=>showSystems();
  document.getElementById('bSysShow').onclick=()=>{sysSel.value=name; sysSel.dispatchEvent(new Event('change')); if(!xray){xray=true;document.getElementById('bXray').classList.add('on');} applyFilter(); closeAll(); toast('Showing '+name+' · X-ray on');};
}
document.getElementById('bSys').addEventListener('click',()=>{if(sheets.sys.classList.contains('open'))closeAll();else showSystems(sysFilter||undefined);});
/* annotation bar: a one-line refresher for whichever system is filtered */
function updateSysbar(){ const el=document.getElementById('sysbar'); const i=sysFilter&&SYSTEM_INFO[sysFilter]; if(!i){el.classList.remove('show');return;} el.innerHTML=`<b>${esc(sysFilter)}</b> · ${esc(i.refresher||i.does)} <span style="color:#a9e28a">· more ›</span>`; el.classList.add('show'); }
document.getElementById('sysbar').addEventListener('click',()=>showSystems(sysFilter));
sysSel.addEventListener('change',updateSysbar);
/* ===== HELP (first run + the ? button) ===== */
const GLOSSARY=[['OE / OEM','the number Ford itself uses for the part (Ford or Motorcraft). Best for exact matching.'],['Aftermarket','a part from another brand made to fit the same spot. Cheaper; check the fitment list.'],['Interchange','a list of other part numbers that fit the same place.'],['Reman','remanufactured: a used unit rebuilt with new wearing parts, usually with a core charge you get back.'],['Core charge','a deposit refunded when you hand in the old part.'],['Fitment','the list of cars a part is sold for. If 2003 Focus 2.0 DOHC is not on it, do not buy it.'],['Zetec','the 2.0 L DOHC 16-valve engine in this car (not the SPI/SOHC, not the Duratec).'],['DOHC','double overhead cam: two camshafts in the head, 4 valves per cylinder.'],['PCM','the engine computer (powertrain control module).'],['PATS','Ford\'s anti-theft system: the key has a chip; a non-chipped copy will not start the car.'],['CJB','central junction box: the fuse and relay box.'],['Degas bottle','the coolant expansion / overflow tank.'],['Transaxle','front-wheel-drive gearbox and differential in one case.'],['CV axle','the drive shaft from the transaxle to each front wheel, with flexible joints.'],['Control Blade','Ford\'s name for this car\'s independent rear suspension arms.'],['Serpentine belt','the single long belt that spins the alternator, power steering pump and A/C.'],['Timing belt','the toothed belt inside the engine that keeps the cams and crank in step. Snaps = engine damage.'],['Snipe','our word for hunting the cheapest correct part (used, salvage, or an auction).']];
function showHelp(){ open('help'); document.getElementById('hbody').innerHTML=`<h2>How to use this</h2><div class="sys">one car, every part, in plain English</div>
  <div class="refresh"><b>The idea</b>Spin the car, pull it apart, tap a part. Each part tells you what it does, when it is failing, how hard it is to replace, which number to order, a video, and where to buy it in Meridian.</div>
  <dl class="kv"><dt>Drag</dt><dd>rotate the car</dd><dt>Explode slider</dt><dd>pulls the car apart so you can see inside (scroll wheel or two-finger pinch also works)</dd><dt>Tap a part</dt><dd>opens its card</dd><dt>Systems</dt><dd>the car explained system by system, with what talks to what</dd><dt>List / Search</dt><dd>find a part by name or number</dd><dt>Filter</dt><dd>show one system at a time</dd><dt>Body</dt><dd>hide the outer panels to see the guts</dd><dt>X-ray</dt><dd>make everything see-through except what you picked</dd><dt>Vehicle</dt><dd>the facts about this exact car (VIN, engine, what is unknown)</dd><dt>+ Part / Data</dt><dd>owner tools: add a part, export or import corrections</dd></dl>
  <h3>Trust badges on part numbers</h3>${Object.keys(CONF).map(k=>`<div class="item" style="cursor:default"><span class="badge c${k}" style="margin:0 6px 0 0">${CONF[k]}</span><small>${esc(CONF_HELP[k])}</small></div>`).join('')}
  <h3>Words you will see</h3>${GLOSSARY.map(([k,v])=>`<div class="item" style="cursor:default"><b>${esc(k)}</b><small>${esc(v)}</small></div>`).join('')}
  <div class="row" style="margin-top:12px"><button class="pri" id="bHelpOk">Got it</button></div>`;
  document.getElementById('bHelpOk').onclick=()=>{localStorage.setItem(KEY+':seen','1'); closeAll();}; }
document.getElementById('bHelp').addEventListener('click',()=>{if(sheets.help.classList.contains('open'))closeAll();else showHelp();});
/* test/deep-link hook: ?open=panel:<id> | list | veh | data | help | systems | systems:<name> */
function openFromUrl(){ const o=new URLSearchParams(location.search).get('open'); if(!o) return false;
  if(o.startsWith('panel:')){const m=byId[o.slice(6)]; if(m) select(m);} else if(o==='list'){renderList();open('list');} else if(o==='veh') showVeh(false); else if(o==='data') showData(); else if(o==='help') showHelp(); else if(o==='systems') showSystems(); else if(o.startsWith('systems:')) showSystems(o.slice(8)); return true; }

/* ===== RUN ===== */
rebuild(); renderList(); updateSubtitle(); updateSysbar();
if(!openFromUrl()&&!localStorage.getItem(KEY+':seen')&&!location.search) showHelp();
let fitted=false;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  if(camera.aspect<1){camera.fov=Math.min(70,38*Math.max(1,1.25/camera.aspect)); camera.updateProjectionMatrix();}
  if(!fitted&&!new URLSearchParams(location.search).has('cam')){const k=camera.aspect<1?1.2:1; camera.position.set(19*k,7*k+1,23*k); fitted=true;}}
addEventListener('resize',resize); resize();
(function tick(){ t+=(tTarget-t)*0.12; for(const m of meshes){const u=m.userData; m.position.copy(u.rest).addScaledVector(u.ex,t*1.6);}
  setOpacity(shell,Math.max(0.06,1-t*1.15)); shell.visible=showBody&&!xray&&t<0.97; controls.update(); renderer.render(scene,camera); requestAnimationFrame(tick); })();
</script>
