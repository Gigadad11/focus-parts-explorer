  if(withGeo){ const n=k=>parseFloat(g(k))||0; o.shape=g('shape'); o.pos=[n('px'),n('py'),n('pz')]; o.size=o.shape==='cyl'?[n('sa')||0.3,n('sb')||1]:[n('sa')||1,n('sb')||1,n('sc')||1]; o.ex=[n('ex'),n('ey'),n('ez')]; o.color=parseInt(g('color').slice(1),16); o.body=!!f.elements.body.checked; }
  return o;
}
function showEdit(p){
  open('panel');
  document.getElementById('pbody').innerHTML=`<h2>Correct: ${esc(p.name)}</h2><div class="sys">${esc(p.sys)}</div><form id="ef">${fieldsHtml(p)}${geoHtml(p)}<div class="row" style="margin-top:14px"><button class="pri" type="submit">Save correction</button><button type="button" id="bCancel">Cancel</button></div><p class="muted" style="margin-top:8px">Saved on this device. Use Data → Export to send the corrected catalog anywhere.</p></form>`;
  const f=document.getElementById('ef'); livePreview(f,p.id);
  f.onsubmit=e=>{e.preventDefault(); const o=readForm(f,true); patch(p.id,o); logChange('corrected '+o.name); saveOverlay(); rebuild(); showPanel(byId[p.id].userData.p); toast('Correction saved');};
  document.getElementById('bCancel').onclick=()=>{rebuild(); showPanel(byId[p.id].userData.p);};
}
function livePreview(f,id){ f.addEventListener('input',()=>{ const m=byId[id]; if(!m)return; const o=readForm(f,true);
  m.userData.rest.set(...o.pos); m.userData.ex.set(...o.ex);
  if(m.userData.built){ setPaint(m,o.color); return; }
  m.material.color.setHex(o.color);
  const geo=o.shape==='cyl'?new THREE.CylinderGeometry(o.size[0],o.size[0],o.size[1],28):new THREE.BoxGeometry(...o.size);
  m.geometry.dispose(); m.geometry=geo; const ed=m.children[0]; ed.geometry.dispose(); ed.geometry=new THREE.EdgesGeometry(geo); }); }

  const f=document.getElementById('af'); livePreview(f,id);
  f.onsubmit=e=>{e.preventDefault(); const o=readForm(f,true); Object.assign(p,o); logChange('added '+o.name); saveOverlay(); rebuild(); showPanel(byId[id].userData.p); renderList(); toast('Part added');};

  document.getElementById('vbody').innerHTML='<h2>Vehicle details</h2><form id="vf">'+VFIELDS.map(([k,l])=>`<label>${l}</label>${k==='notes'||k==='trans'?`<textarea name="${k}">${esc(V[k]||'')}</textarea>`:`<input name="${k}" value="${esc(V[k]||'')}"/>`}`).join('')+'<div class="row" style="margin-top:14px"><button class="pri" type="submit">Save</button><button type="button" id="bVCancel">Cancel</button></div></form>';
  const f=document.getElementById('vf'); f.onsubmit=e=>{e.preventDefault(); for(const [k] of VFIELDS){const v=f.elements[k].value.trim(); if(v!==String(VEHICLE[k]??'')) overlay.vehicle[k]=v; else delete overlay.vehicle[k];} logChange('vehicle details updated'); saveOverlay(); rebuild(); showVeh(false); toast('Saved');};
  document.getElementById('bVCancel').onclick=()=>showVeh(false); }
document.getElementById('bVeh').addEventListener('click',()=>{if(sheets.veh.classList.contains('open'))closeAll();else showVeh(false);});
function exportJson(){ const out={exported:new Date().toISOString(),vehicle:vehicle(),parts:allParts(),overlay}; const b=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='focus-'+vehicle().vin+'-catalog.json'; a.click(); }
function showData(){ open('data'); const n=Object.keys(overlay.parts).length, c=overlay.custom.length, d=overlay.deleted.length;
  document.getElementById('dbody').innerHTML=`<h2>Data</h2><div class="muted">Corrections are stored in this browser only. Export to keep them or move them to another device.</div>
  <dl><dt>Corrected parts</dt><dd>${n}</dd><dt>Added parts</dt><dd>${c}</dd><dt>Hidden parts</dt><dd>${d}</dd></dl>
  <div class="row" style="margin-top:12px"><button class="pri" id="bExport">Export JSON</button><button id="bImport">Import JSON</button><button id="bCopy">Copy corrections</button><button class="danger" id="bReset">Reset to assumptions</button></div>
  <h3>Change log</h3>${overlay.log.slice(0,40).map(l=>`<div class="item" style="cursor:default">${esc(l.what)}<small>${new Date(l.t).toLocaleString()}</small></div>`).join('')||'<div class="muted">no changes yet</div>'}`;
  document.getElementById('bExport').onclick=exportJson;
  document.getElementById('bImport').onclick=()=>document.getElementById('importFile').click();
  document.getElementById('bCopy').onclick=()=>navigator.clipboard.writeText(JSON.stringify(overlay)).then(()=>toast('Copied'));
  document.getElementById('bReset').onclick=()=>{if(!confirm('Throw away every correction on this device?'))return; overlay={vehicle:{},parts:{},custom:[],deleted:[],log:[]}; saveOverlay(); rebuild(); renderList(); showData();}; }
document.getElementById('bData').addEventListener('click',()=>{if(sheets.data.classList.contains('open'))closeAll();else showData();});
document.getElementById('importFile').addEventListener('change',e=>{const f=e.target.files[0]; if(!f)return; f.text().then(txt=>{const j=JSON.parse(txt); const ov=j.overlay||j; if(!ov.parts||!ov.custom) throw new Error('not a catalog export');
  overlay=Object.assign({vehicle:{},parts:{},custom:[],deleted:[],log:[]},ov); logChange('imported '+f.name); saveOverlay(); rebuild(); renderList(); showData(); toast('Imported');}).catch(err=>alert('Import failed: '+err.message)); e.target.value='';});

/* ===== RUN ===== */
rebuild(); renderList(); updateSubtitle();
let fitted=false;
function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  if(camera.aspect<1){camera.fov=Math.min(70,38*Math.max(1,1.25/camera.aspect)); camera.updateProjectionMatrix();}
  if(!fitted&&!new URLSearchParams(location.search).has('cam')){const k=camera.aspect<1?1.2:1; camera.position.set(19*k,7*k+1,23*k); fitted=true;}}
addEventListener('resize',resize); resize();
(function tick(){ t+=(tTarget-t)*0.12; for(const m of meshes){const u=m.userData; m.position.copy(u.rest).addScaledVector(u.ex,t*1.6);}
  setOpacity(shell,Math.max(0.06,1-t*1.15)); shell.visible=showBody&&!xray&&t<0.97; controls.update(); renderer.render(scene,camera); requestAnimationFrame(tick); })();
